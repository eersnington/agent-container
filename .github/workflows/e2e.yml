name: E2E

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi-sdk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run e2e tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee e2e.log

      - name: Upload e2e log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: e2e.log
